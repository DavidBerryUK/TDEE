<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDEE Theme Palettes</title>
<style>
:root{--pg:#eef0f3;--ink:#1a1a1a;--mut:#666}
@media (prefers-color-scheme:dark){:root{--pg:#0b0b0d;--ink:#eee;--mut:#999}}
body{margin:0;padding:16px;background:var(--pg);color:var(--ink);font:14px -apple-system,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto 16px}
h1{font-size:20px;margin:0}.mut{color:var(--mut);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--mut);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;color:var(--ink);padding:6px 14px;font:inherit;cursor:pointer}.seg button.on{background:var(--ink);color:var(--pg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;max-width:1400px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:6px}.name{font-weight:600}.d{color:var(--mut);font-size:12px}
.phone{border-radius:28px;padding:14px;background:var(--background);color:var(--text);border:6px solid #222;min-height:470px}
.nav{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px}.nav b{font-size:20px}.nav span{color:var(--primary);font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.lab{color:var(--textSecondary);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:32px;font-weight:700;color:var(--primary)}.big small{font-size:14px;color:var(--textSecondary);font-weight:500}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 8px}
.leg{display:flex;justify-content:space-between;font-size:12px}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)}.row:first-of-type{border-top:0}.row em{color:var(--textSecondary);font-style:normal}
.btn{display:block;text-align:center;background:var(--primary);color:var(--onp);border-radius:10px;padding:10px;font-weight:600;margin-top:4px}
.tag{display:inline-block;margin-top:8px;font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--secondary);color:var(--secondary)}
.sw{display:flex;border-radius:6px;overflow:hidden;height:22px}.sw div{flex:1}
</style></head><body>
<header><div><h1>TDEE theme palettes — draft v2 (Flat UI)</h1><div class="mut">10 themes · light &amp; dark · Default = current app colours; all others pass WCAG contrast and CVD checks</div></div>
<div class="seg"><button data-m="light" class="on">Light</button><button data-m="dark">Dark</button><button data-m="both">Side by side</button></div></header>
<div class="grid" id="g"></div>
<script>
const D={"tokens": ["primary", "secondary", "background", "surface", "text", "textSecondary", "border", "macroProtein", "macroCarbs", "macroFat"], "themes": {"Default": {"desc": "The app's current look: iOS system colours, blue accent", "light": {"primary": "#007AFF", "secondary": "#FF3B30", "background": "#F2F2F7", "surface": "#FFFFFF", "text": "#000000", "textSecondary": "#8A8A8E", "border": "#C6C6C8", "macroProtein": "#FF584F", "macroCarbs": "#007AFF", "macroFat": "#00C7BE"}, "dark": {"primary": "#0A84FF", "secondary": "#FF453A", "background": "#000000", "surface": "#1C1C1E", "text": "#FFFFFF", "textSecondary": "#98989F", "border": "#38383A", "macroProtein": "#DD3F36", "macroCarbs": "#0A84FF", "macroFat": "#63E6E2"}}, "Clouds": {"desc": "Calm greys with a wet-asphalt accent", "light": {"primary": "#34495E", "secondary": "#7F8C8D", "background": "#F4F6F7", "surface": "#FFFFFF", "text": "#1E2A36", "textSecondary": "#536476", "border": "#D5DBDF", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#AE8E0A"}, "dark": {"primary": "#95A5A6", "secondary": "#7F8C8D", "background": "#121619", "surface": "#1C2226", "text": "#ECF0F1", "textSecondary": "#92A1A6", "border": "#222C34", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#F1C40F"}}, "Turquoise": {"desc": "Fresh turquoise and green-sea", "light": {"primary": "#117D68", "secondary": "#34495E", "background": "#EFFAF8", "surface": "#FFFFFF", "text": "#1B383E", "textSecondary": "#46787C", "border": "#D1F2EB", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#AE8E0A"}, "dark": {"primary": "#1ABC9C", "secondary": "#587CA0", "background": "#0F1D1E", "surface": "#1A3232", "text": "#ECF0F1", "textSecondary": "#8DB8B2", "border": "#1A554D", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#F1C40F"}}, "Emerald": {"desc": "Natural greens", "light": {"primary": "#1D8148", "secondary": "#16A085", "background": "#F0FBF5", "surface": "#FFFFFF", "text": "#1D3A39", "textSecondary": "#49786F", "border": "#D5F5E3", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#AE8E0A"}, "dark": {"primary": "#2ECC71", "secondary": "#16A085", "background": "#101E1B", "surface": "#1C342D", "text": "#ECF0F1", "textSecondary": "#91BBAA", "border": "#205A3E", "macroProtein": "#E92366", "macroCarbs": "#3498DB", "macroFat": "#F1C40F"}}, "Peter River": {"desc": "Clear sky blue", "light": {"primary": "#1F74AE", "secondary": "#17A388", "background": "#F1F8FC", "surface": "#FFFFFF", "text": "#1E3445", "textSecondary": "#507490", "border": "#D6EAF8", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#AE8E0A"}, "dark": {"primary": "#3D9CDD", "secondary": "#1ABC9C", "background": "#111A22", "surface": "#1D2E3A", "text": "#ECF0F1", "textSecondary": "#92B1BF", "border": "#234862", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#F1C40F"}}, "Amethyst": {"desc": "Rich purple", "light": {"primary": "#9650B2", "secondary": "#E91E63", "background": "#F8F3FA", "surface": "#FFFFFF", "text": "#2A2C41", "textSecondary": "#6C688C", "border": "#EBDEF0", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#AE8E0A"}, "dark": {"primary": "#B17EC6", "secondary": "#E91E63", "background": "#18161F", "surface": "#292636", "text": "#ECF0F1", "textSecondary": "#A7A4B8", "border": "#463356", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#F1C40F"}}, "Sunflower": {"desc": "Warm sunshine yellow", "light": {"primary": "#886E08", "secondary": "#DF7619", "background": "#FEFBEE", "surface": "#FFFFFF", "text": "#35392D", "textSecondary": "#747457", "border": "#FCF3CF", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#AE8E0A"}, "dark": {"primary": "#F1C40F", "secondary": "#E67E22", "background": "#1E1E14", "surface": "#343321", "text": "#ECF0F1", "textSecondary": "#B8BA96", "border": "#63571D", "macroProtein": "#EB2E6E", "macroCarbs": "#3498DB", "macroFat": "#F1C40F"}}, "Carrot": {"desc": "Energetic orange", "light": {"primary": "#AB5A13", "secondary": "#D35400", "background": "#FDF6F0", "surface": "#FFFFFF", "text": "#33312F", "textSecondary": "#7B6D64", "border": "#FAE5D3", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#AE8E0A"}, "dark": {"primary": "#E67E22", "secondary": "#D35400", "background": "#1D1915", "surface": "#322A24", "text": "#ECF0F1", "textSecondary": "#B6AC9A", "border": "#5F3F24", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#F1C40F"}}, "Alizarin": {"desc": "Bold red", "light": {"primary": "#D32B1A", "secondary": "#C0392B", "background": "#FDF2F1", "surface": "#FFFFFF", "text": "#332B32", "textSecondary": "#80656E", "border": "#FADBD8", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#AE8E0A"}, "dark": {"primary": "#EB675A", "secondary": "#D03E2F", "background": "#1D1517", "surface": "#332427", "text": "#ECF0F1", "textSecondary": "#B6A29F", "border": "#602E2C", "macroProtein": "#E91E63", "macroCarbs": "#3498DB", "macroFat": "#F1C40F"}}, "High Contrast": {"desc": "Maximum legibility, single strong accent", "light": {"primary": "#0033CC", "secondary": "#000000", "background": "#FFFFFF", "surface": "#FFFFFF", "text": "#000000", "textSecondary": "#262626", "border": "#000000", "macroProtein": "#A3001B", "macroCarbs": "#0033CC", "macroFat": "#B36B00"}, "dark": {"primary": "#7FB2FF", "secondary": "#FFFFFF", "background": "#000000", "surface": "#000000", "text": "#FFFFFF", "textSecondary": "#E0E0E0", "border": "#FFFFFF", "macroProtein": "#FF8C9E", "macroCarbs": "#7FB2FF", "macroFat": "#FFC94D"}}}, "contrast": [["Default", "light", 21.0, 3.4, 4.0, 2.1], ["Default", "dark", 17.0, 5.9, 4.7, 3.9], ["Clouds", "light", 14.6, 6.1, 9.3, 3.1], ["Clouds", "dark", 14.0, 6.0, 6.3, 3.7], ["Turquoise", "light", 12.5, 5.0, 5.1, 3.1], ["Turquoise", "dark", 11.8, 6.2, 5.6, 3.1], ["Emerald", "light", 12.2, 5.0, 4.9, 3.1], ["Emerald", "dark", 11.6, 6.3, 6.3, 3.1], ["Peter River", "light", 12.9, 5.0, 5.0, 3.1], ["Peter River", "dark", 12.2, 6.2, 4.7, 3.2], ["Amethyst", "light", 13.7, 5.3, 5.1, 3.1], ["Amethyst", "dark", 12.8, 6.1, 4.7, 3.4], ["Sunflower", "light", 11.8, 4.8, 4.9, 3.1], ["Sunflower", "dark", 11.1, 6.4, 7.7, 3.1], ["Carrot", "light", 13.0, 5.0, 5.0, 3.1], ["Carrot", "dark", 12.3, 6.3, 4.9, 3.2], ["Alizarin", "light", 13.7, 5.2, 5.1, 3.1], ["Alizarin", "dark", 12.9, 6.1, 4.7, 3.4], ["High Contrast", "light", 21.0, 15.1, 9.0, 4.2], ["High Contrast", "dark", 21.0, 15.9, 9.7, 9.5]]};
function lum(h){return [1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(x=>x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4)).reduce((a,x,i)=>a+x*[.2126,.7152,.0722][i],0)}
function onp(h){return lum(h)>.18?'#000':'#fff'}
function phone(p){const v=Object.entries(p).map(([k,x])=>`--${k}:${x}`).join(';')+`;--onp:${onp(p.primary)}`;
return `<div class="phone" style="${v}"><div class="nav"><b>TDEE</b><span>Edit</span></div>
<div class="card"><div class="lab">Daily target</div><div class="big">2,340 <small>kcal</small></div><div class="d" style="color:var(--textSecondary)">TDEE 2,840 · −500 deficit</div><span class="tag">Moderate loss</span></div>
<div class="card"><div class="lab">Macro split</div><div class="bar"><div style="flex:30;background:var(--macroProtein)"></div><div style="flex:45;background:var(--macroCarbs)"></div><div style="flex:25;background:var(--macroFat)"></div></div>
<div class="leg"><span><i style="background:var(--macroProtein)"></i>Protein 176g</span><span><i style="background:var(--macroCarbs)"></i>Carbs 263g</span><span><i style="background:var(--macroFat)"></i>Fat 65g</span></div></div>
<div class="card"><div class="row"><span>Age</span><em>38</em></div><div class="row"><span>Weight</span><em>82 kg</em></div><div class="row"><span>Activity</span><em>Moderate</em></div></div>
<div class="btn">Share results</div></div>`}
function sw(p){return '<div class="sw">'+D.tokens.map(k=>`<div title="${k} ${p[k]}" style="background:${p[k]}"></div>`).join('')+'</div>'}
let mode='light';try{mode=localStorage.getItem('m')||mode}catch(e){}
function draw(){document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));
const g=document.getElementById('g');g.style.gridTemplateColumns=mode=='both'?'repeat(auto-fill,minmax(min(100%,600px),1fr))':'';
g.innerHTML=Object.entries(D.themes).map(([n,t])=>{const ms=mode=='both'?['light','dark']:[mode];
return `<div class="col"><div class="name">${n}</div><div class="d">${t.desc}</div><div style="display:grid;grid-template-columns:repeat(${ms.length},minmax(0,1fr));gap:10px">${ms.map(m=>`<div class="col">${sw(t[m])}${phone(t[m])}</div>`).join('')}</div></div>`}).join('')}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;try{localStorage.setItem('m',mode)}catch(e){}draw()});draw();
</script></body></html>
